<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoshi TeleOp Controls</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 6px; background: #fff; color: #132334; font-family: Arial, sans-serif; }
    main { width: 100%; margin: auto; padding: 8px; border: 1px solid #c7d3e5; border-radius: 16px; }
    h1 { margin: 0 0 8px; color: #2457cf; font-size: clamp(20px, 3vw, 32px); }
    .intro { margin: 0 0 8px; color: #465b74; font-size: 22px; line-height: 1.4; }
    .diagram { min-width: 0; aspect-ratio: 1240 / 720; }
    svg { display: block; width: 100%; height: 100%; }
    .box { stroke-width: 2.5; rx: 12; }
    .heading { font-size: 25px; font-weight: 800; }
    .detail { font-size: 21px; }
    .small { font-size: 18px; }
    .connector { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .connector-halo { fill: none; stroke: #fff; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .marker circle { fill: currentColor; stroke: #fff; stroke-width: 3; r: 6; }
    .symbol { font: 700 27px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .hardware-label { fill: #fff; font-size: 15px; font-weight: 700; text-anchor: middle; }
    @page { size: 1240px 776px; margin: 0; }
    @media print {
      body { padding: 0; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      main { width: 100%; max-width: none; padding: 0; border: 0; border-radius: 0; }
      h1 { font-size: 32px; line-height: 48px; margin: 0 0 8px; padding: 0 12px; }
      .intro { font-size: 16px; }
      .diagram { overflow: visible; }
      svg { height: auto; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Gamepad 1 Controls</h1>
    <div class="diagram" role="region" aria-label="Driver controls diagram">
      <svg viewBox="0 0 1240 720" role="img" aria-labelledby="map-title map-desc">
        <title id="map-title">Yoshi Gamepad 1 controls</title>
        <desc id="map-desc">Left stick drives forward, backward, and strafes. Right stick turns. D-pad down selects 25 percent wheel speed, left 50 percent, right 75 percent, and up 100 percent. Triangle increases intake power; Cross decreases it. Square increases shooter speed; Circle decreases it. Right trigger runs the trigger servo forward while held; left trigger reverses it. Right trigger takes priority when both are held.</desc>
        <defs>
          <linearGradient id="shell" x1="0" y1="0" x2="0.8" y2="1">
            <stop stop-color="#6492ff"/><stop offset="0.45" stop-color="#3d49ac"/><stop offset="1" stop-color="#272041"/>
          </linearGradient>
          <linearGradient id="pad" x2="0" y2="1">
            <stop stop-color="#6c9cff"/><stop offset="1" stop-color="#3a5fc7"/>
          </linearGradient>
        </defs>

        <g aria-label="PlayStation-style controller">
          <rect x="435" y="205" width="74" height="44" rx="14" fill="#252639" stroke="#45465e" stroke-width="3"/>
          <rect x="731" y="205" width="74" height="44" rx="14" fill="#252639" stroke="#45465e" stroke-width="3"/>
          <path d="M432 244 C481 216 544 231 572 239 H668 C711 225 761 221 808 244 C838 268 855 342 864 435 L876 509 C881 556 850 584 823 558 L752 462 C730 437 704 424 671 424 H569 C536 424 510 437 488 462 L417 558 C390 584 359 556 364 509 L376 435 C385 342 402 268 432 244 Z"
            fill="url(#shell)" stroke="#27243e" stroke-width="5"/>
          <rect x="521" y="247" width="198" height="108" rx="24" fill="url(#pad)" stroke="#283c80" stroke-width="4"/>
          <rect x="430" y="237" width="80" height="17" rx="7" fill="#38374e"/>
          <rect x="730" y="237" width="80" height="17" rx="7" fill="#38374e"/>
          <text class="hardware-label" x="470" y="232">L2</text>
          <text class="hardware-label" x="770" y="232">R2</text>
          <path d="M439 319 h21 v-24 h27 v24 h23 v27 h-23 v24 h-27 v-24 h-21z" fill="#25293f" stroke="#171b2b" stroke-width="3"/>
          <text class="hardware-label" x="474" y="315">&#9650;</text>
          <text class="hardware-label" x="474" y="363">&#9660;</text>
          <circle cx="752" cy="291" r="19" fill="#25293f" stroke="#20223e" stroke-width="3"/>
          <circle cx="717" cy="330" r="19" fill="#25293f" stroke="#20223e" stroke-width="3"/>
          <circle cx="787" cy="330" r="19" fill="#25293f" stroke="#20223e" stroke-width="3"/>
          <circle cx="752" cy="369" r="19" fill="#25293f" stroke="#20223e" stroke-width="3"/>
          <text class="symbol" fill="#7de4cb" x="752" y="291">&#9651;</text>
          <text class="symbol" fill="#edb2e0" x="717" y="330">&#9633;</text>
          <text class="symbol" fill="#ffa5b0" x="787" y="330">&#9675;</text>
          <text class="symbol" fill="#a8ceff" x="752" y="369">&#215;</text>
          <circle cx="540" cy="405" r="42" fill="#29283e" stroke="#565776" stroke-width="5"/>
          <circle cx="540" cy="405" r="29" fill="#45445c" stroke="#1e2035" stroke-width="3"/>
          <circle cx="700" cy="405" r="42" fill="#29283e" stroke="#565776" stroke-width="5"/>
          <circle cx="700" cy="405" r="29" fill="#45445c" stroke="#1e2035" stroke-width="3"/>
          <circle cx="620" cy="400" r="12" fill="#25293f"/>
          <rect x="605" y="427" width="30" height="6" rx="3" fill="#92b5bd"/>
        </g>

        <g aria-label="Control connection lines">
          <defs>
            <path id="trigger-route" d="M530 143 L470 216 M700 143 L770 216"/>
            <path id="shooter-route" d="M890 78 H845 V245 L717 330 M890 109 H875 V310 L787 330"/>
            <path id="wheel-route" d="M318 350 H395 L430 332"/>
            <path id="intake-route" d="M922 330 H866 L752 291 M922 361 H853 L752 369"/>
            <path id="driving-route" d="M540 591 V405 M700 591 V405"/>
          </defs>
          <g class="connector">
            <use class="connector-halo" href="#trigger-route"/>
            <use href="#trigger-route" stroke="#14834b"/>
            <use class="connector-halo" href="#shooter-route"/>
            <use href="#shooter-route" stroke="#b55b09"/>
            <use class="connector-halo" href="#wheel-route"/>
            <use href="#wheel-route" stroke="#7746cf"/>
            <use class="connector-halo" href="#intake-route"/>
            <use href="#intake-route" stroke="#14834b"/>
            <use class="connector-halo" href="#driving-route"/>
            <use href="#driving-route" stroke="#2457cf"/>
          </g>
        </g>
        <g class="marker">
          <g style="color: #14834b">
            <circle cx="470" cy="216"/>
            <circle cx="770" cy="216"/>
          </g>
          <g style="color: #b55b09">
            <circle cx="717" cy="330"/>
            <circle cx="787" cy="330"/>
          </g>
          <g style="color: #7746cf">
            <circle cx="474" cy="306"/>
            <circle cx="448" cy="332"/>
            <circle cx="500" cy="332"/>
            <circle cx="474" cy="358"/>
          </g>
          <g style="color: #14834b">
            <circle cx="752" cy="291"/>
            <circle cx="752" cy="369"/>
          </g>
          <g style="color: #2457cf">
            <circle cx="540" cy="405"/>
            <circle cx="700" cy="405"/>
          </g>
        </g>

        <g aria-label="Trigger servo" transform="translate(500 0)">
          <rect class="box" x="12" y="35" width="210" height="108" fill="#eaf6ef" stroke="#14834b"/>
          <text class="heading" x="24" y="65">Trigger servo</text>
          <text class="detail" x="24" y="96">Left: reverse</text>
          <text class="detail" x="24" y="126">Right: forward</text>
        </g>
        <g aria-label="Shooter speed" transform="translate(445 0)">
          <rect class="box" x="445" y="12" width="250" height="112" fill="#fff3e7" stroke="#b55b09"/>
          <text class="heading" x="459" y="44">Shooter speed</text>
          <text class="detail" x="459" y="78">Square: increase speed</text>
          <text class="detail" x="459" y="109">Circle: decrease speed</text>
        </g>
        <g aria-label="Wheel speed">
          <rect class="box" x="12" y="251" width="306" height="174" fill="#f2ecfc" stroke="#7746cf"/>
          <text class="heading" x="24" y="283">Wheel speed (D-pad)</text>
          <text class="detail" x="24" y="315">Up: 100% (turbo)</text>
          <text class="detail" x="24" y="347">Left: 50% (medium)</text>
          <text class="detail" x="24" y="379">Right: 75% (fast)</text>
          <text class="detail" x="24" y="411">Down: 25% (slow)</text>
        </g>
        <g aria-label="Intake">
          <rect class="box" x="922" y="267" width="258" height="108" fill="#eaf6ef" stroke="#14834b"/>
          <text class="heading" x="936" y="299">Intake</text>
          <text class="detail" x="936" y="330">Triangle: increase power</text>
          <text class="detail" x="936" y="361">Cross: decrease power</text>
        </g>
        <g aria-label="Driving" transform="translate(75 0)">
          <rect class="box" x="412" y="591" width="266" height="108" fill="#edf3ff" stroke="#2457cf"/>
          <text class="heading" x="426" y="622">Driving</text>
          <text class="detail" x="426" y="654">Left stick: drive + strafe</text>
          <text class="detail" x="426" y="686">Right stick: turn left / right</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
