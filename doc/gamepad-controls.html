<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoshi TeleOp Controls</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 6px; background: #fff; color: #132334; font-family: Arial, sans-serif; }
    main { width: 100%; margin: auto; padding: 8px; border: 1px solid #c7d3e5; border-radius: 16px; }
    h1 { margin: 0 0 8px; color: #2457cf; font-size: clamp(20px, 3vw, 32px); }
    .intro { margin: 0 0 8px; color: #465b74; font-size: 22px; line-height: 1.4; }
    .diagram { min-width: 0; aspect-ratio: 1240 / 720; }
    svg { display: block; width: 100%; height: 100%; }
    .box { stroke-width: 2.5; rx: 12; }
    .heading { font-size: 25px; font-weight: 800; }
    .detail { font-size: 21px; }
    .small { font-size: 18px; }
    .connector { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .connector-halo { fill: none; stroke: #fff; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .marker circle { fill: none; stroke: currentColor; stroke-width: 3; r: 18; }
    .marker .small-ring { r: 10; }
    .marker .stick-ring { r: 34; }
    @page { size: letter landscape; margin: 0.25in; }
    @media print {
      body { padding: 0; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      main { width: 10.5in; max-width: 100%; padding: 0; border: 0; border-radius: 0; break-inside: avoid; }
      h1 { font-size: 24px; line-height: 32px; margin: 0 0 6px; padding: 0; }
      .intro { font-size: 16px; }
      .diagram { overflow: visible; }
      svg { height: auto; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Gamepad 1 Controls</h1>
    <div class="diagram" role="region" aria-label="Driver controls diagram">
      <svg viewBox="0 0 1240 720" role="img" aria-labelledby="map-title map-desc">
        <title id="map-title">Yoshi Gamepad 1 controls</title>
        <desc id="map-desc">Yoshi TeleOp uses gamepad 1. Left stick drives forward, backward, and strafes. Right stick turns. D-pad down selects 25 percent wheel speed, left 50 percent, right 75 percent, and up 100 percent; default is 75 percent. Hold Triangle (Y) to increase intake power by 0.001 per loop; hold Cross (A) to decrease it, limited to minus 100 through 100 percent. Hold Square (X) to increase shooter speed by 10 ticks per second per loop; hold Circle (B) to decrease it. Release the left bumper (L1/LB) to increase shooter P by 5; release the right bumper (R1/RB) to decrease it. P tuning is for testing, not competition. Right trigger (R2/RT) runs the trigger servo forward at full power while held; left trigger (L2/LT) reverses it. Right trigger takes priority when both are held; releasing both stops the trigger. On Start, intake runs at 100 percent and shooter target is 1300 ticks per second; initial P is 67.</desc>
        <g aria-label="PlayStation-style controller">
          <image href="controller.png" x="350" y="190" width="540" height="377">
            <title>Supplied PlayStation controller image</title>
          </image>
        </g>

        <g aria-label="Control connection lines">
          <defs>
            <mask id="control-centers" maskUnits="userSpaceOnUse" x="0" y="0" width="1240" height="720">
              <rect width="1240" height="720" fill="white"/>
              <g fill="black">
                <circle cx="473" cy="221" r="9"/><circle cx="771" cy="221" r="9"/>
                <circle cx="473" cy="239" r="9"/><circle cx="771" cy="239" r="9"/>
                <circle cx="736" cy="307" r="17"/><circle cx="806" cy="307" r="17"/>
                <circle cx="771" cy="272" r="17"/><circle cx="771" cy="342" r="17"/>
                <circle cx="472" cy="278" r="9"/><circle cx="444" cy="307" r="9"/>
                <circle cx="497" cy="307" r="9"/><circle cx="472" cy="330" r="9"/>
                <circle cx="545" cy="373" r="33"/><circle cx="698" cy="373" r="33"/>
              </g>
            </mask>
            <path id="trigger-route" d="M512 143 L473 221 M560 143 L771 221"/>
            <path id="shooter-route" d="M890 268 H845 L736 307 M890 299 H875 L806 307"/>
            <path id="wheel-route" d="M318 350 H395 L444 307"/>
            <path id="intake-route" d="M922 453 C850 453 875 350 850 300 C838 275 810 272 771 272 M922 484 C835 484 860 375 771 342"/>
            <path id="driving-route" d="M545 516 V373 M698 516 V373"/>
            <path id="p-route" d="M785 143 L473 239 M885 143 L771 239"/>
          </defs>
          <g class="connector" mask="url(#control-centers)">
            <use class="connector-halo" href="#trigger-route"/>
            <use href="#trigger-route" stroke="#14834b"/>
            <use class="connector-halo" href="#shooter-route"/>
            <use href="#shooter-route" stroke="#b55b09"/>
            <use class="connector-halo" href="#wheel-route"/>
            <use href="#wheel-route" stroke="#7746cf"/>
            <use class="connector-halo" href="#intake-route"/>
            <use href="#intake-route" stroke="#14834b"/>
            <use class="connector-halo" href="#driving-route"/>
            <use href="#driving-route" stroke="#2457cf"/>
            <use class="connector-halo" href="#p-route"/>
            <use href="#p-route" stroke="#b55b09"/>
          </g>
        </g>
        <g class="marker">
          <g style="color: #14834b">
            <circle class="small-ring" cx="473" cy="221"/>
            <circle class="small-ring" cx="771" cy="221"/>
          </g>
          <g style="color: #b55b09">
            <circle class="small-ring" cx="473" cy="239"/>
            <circle class="small-ring" cx="771" cy="239"/>
            <circle cx="736" cy="307"/>
            <circle cx="806" cy="307"/>
          </g>
          <g style="color: #7746cf">
            <circle class="small-ring" cx="472" cy="278"/>
            <circle class="small-ring" cx="444" cy="307"/>
            <circle class="small-ring" cx="497" cy="307"/>
            <circle class="small-ring" cx="472" cy="330"/>
          </g>
          <g style="color: #14834b">
            <circle cx="771" cy="272"/>
            <circle cx="771" cy="342"/>
          </g>
          <g style="color: #2457cf">
            <circle class="stick-ring" cx="545" cy="373"/>
            <circle class="stick-ring" cx="698" cy="373"/>
          </g>
        </g>

        <g aria-label="Shooter p-value" transform="translate(753 0)">
          <rect class="box" x="12" y="35" width="240" height="108" fill="#fff3e7" stroke="#b55b09"/>
          <text class="heading" x="24" y="65">Shooter p-value</text>
          <text class="detail" x="24" y="96">Left: p-value + 5</text>
          <text class="detail" x="24" y="128">Right: p-value - 5</text>
        </g>
        <g aria-label="Trigger" transform="translate(400 0)">
          <rect class="box" x="12" y="35" width="200" height="108" fill="#eaf6ef" stroke="#14834b"/>
          <text class="heading" x="24" y="65">Trigger</text>
          <text class="detail" x="24" y="96">Left: reverse</text>
          <text class="detail" x="24" y="126">Right: forward</text>
        </g>
        <g aria-label="Shooter speed" transform="translate(445 190)">
          <rect class="box" x="445" y="12" width="220" height="112" fill="#fff3e7" stroke="#b55b09"/>
          <text class="heading" x="459" y="44">Shooter speed</text>
          <text class="detail" x="459" y="78">Square / X: +10</text>
          <text class="detail" x="459" y="109">Circle / B: -10</text>
        </g>
        <g aria-label="Wheel speed">
          <rect class="box" x="12" y="251" width="306" height="174" fill="#f2ecfc" stroke="#7746cf"/>
          <text class="heading" x="24" y="283">Wheel speed (D-pad)</text>
          <text class="detail" x="24" y="315">Up: 100% (turbo)</text>
          <text class="detail" x="24" y="347">Left: 50% (medium)</text>
          <text class="detail" x="24" y="379">Right: 75% (fast)</text>
          <text class="detail" x="24" y="411">Down: 25% (slow)</text>
        </g>
        <g aria-label="Intake" transform="translate(0 123)">
          <rect class="box" x="922" y="267" width="220" height="108" fill="#eaf6ef" stroke="#14834b"/>
          <text class="heading" x="936" y="299">Intake</text>
          <text class="detail" x="936" y="330">Triangle / Y: faster</text>
          <text class="detail" x="936" y="361">Cross / A: slower</text>
        </g>
        <g aria-label="Starting settings">
          <text class="heading" x="24" y="505">On Start</text>
          <text class="detail" x="24" y="538">Intake: 100% power</text>
          <text class="detail" x="24" y="570">Wheel speed: 75%</text>
          <text class="detail" x="24" y="602">Shooter speed: 1300</text>
          <text class="detail" x="24" y="634">Shooter p-value: 67</text>
        </g>
        <g aria-label="Driving" transform="translate(75 -75)">
          <rect class="box" x="412" y="591" width="266" height="108" fill="#edf3ff" stroke="#2457cf"/>
          <text class="heading" x="426" y="622">Driving</text>
          <text class="detail" x="426" y="654">Left stick: drive + strafe</text>
          <text class="detail" x="426" y="686">Right stick: turn left / right</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
